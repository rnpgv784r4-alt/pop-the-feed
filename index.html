/* ===== 80s arcade music (synthesized, no files) ===== */
const Music=(()=>{
 let ctx=null,out=null,on=false,tmr=null,step=0,next=0,round=1,nodes=[];
 // A minor driving progression: Am F C G, 16 steps per bar-pair (16th notes)
 const ROOT=[45,41,48,43]; // A2 F2 C3 G2 (bass roots)
 const CH=[[57,60,64],[53,57,60],[60,64,67],[55,59,62]];
 const LEAD=[ // 16-step arpeggio/lead patterns per chord (semitone offsets from chord top idx), 0=rest
  [76,0,79,0,81,0,79,76,0,79,0,84,0,81,79,0],
  [77,0,81,0,84,0,81,77,0,81,0,84,0,89,84,0],
  [79,0,84,0,88,0,84,79,0,84,0,88,0,91,88,0],
  [78,0,83,0,86,0,83,78,0,83,0,86,0,90,86,0]];
 const f=m=>440*Math.pow(2,(m-69)/12);
 function tone(t,m,len,type,vol,det){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f(m);if(det)o.detune.value=det;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(g);g.connect(out);o.start(t);o.stop(t+len+.02)}
 function noise(t,len,hp,vol){const n=Math.floor(ctx.sampleRate*len),b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=ctx.createBufferSource();s.buffer=b;const fl=ctx.createBiquadFilter();fl.type='highpass';fl.frequency.value=hp;const g=ctx.createGain();g.gain.value=vol;s.connect(fl);fl.connect(g);g.connect(out);s.start(t)}
 function kick(t){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);g.gain.setValueAtTime(.55,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g);g.connect(out);o.start(t);o.stop(t+.18)}
 function bpm(){return 128+round*10} // 138 -> 178
 function sched(){
  const sd=60/bpm()/4;
  while(next<ctx.currentTime+.25){
   const s=step%64,bar=Math.floor(s/16)%4,k=s%16,t=next;
   // drums
   if(k%4===0)kick(t);
   if(k===4||k===12)noise(t,.1,1500,.32);
   if(k%2===0)noise(t,.03,7000,.09);
   // driving 8th-note bass
   if(k%2===0)tone(t,ROOT[bar]-(k%4===2&&round>2?-12:0),sd*1.8,'sawtooth',.2);
   // lead
   const L=LEAD[bar][k];if(L){tone(t,L,sd*1.6,'square',.1);tone(t,L,sd*1.6,'square',.05,9)}
   // fast arpeggio pad on higher rounds
   if(round>=3&&k%2===1)tone(t,CH[bar][(k>>1)%3]+12,sd*.9,'triangle',.07);
   if(round>=5&&k%4===3)tone(t,LEAD[bar][(k+4)%16]||CH[bar][2]+12,sd*.7,'square',.05);
   next+=sd;step++;
  }
  tmr=setTimeout(sched,60)
 }
 return{
  start(){try{ctx=AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(ctx.state!=='running')ctx.resume();ctx=AC;
   out=ctx.createGain();out.gain.value=.5;const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=6500;out.connect(lp);lp.connect(ctx.destination);
   on=true;step=0;round=1;next=ctx.currentTime+.1;sched()}catch(e){}},
  setRound(r){round=r},
  stop(){on=false;clearTimeout(tmr);if(out){const o=out;try{o.gain.setTargetAtTime(0,ctx.currentTime,.08);setTimeout(()=>{try{o.disconnect()}catch(e){}},500)}catch(e){}out=null}}
 }
})();

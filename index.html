<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pop The Feed</title>
<style>
:root{--bg:#1b0c2b;--card:#fffaf0;--ink:#2a1238;--acc:#e8397d;box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;font-family:Georgia,'Times New Roman',serif}
#stage{position:fixed;inset:0}
svg{width:100%;height:100%;display:block}
.pop{opacity:0;transition:opacity .12s}
.pop.on{opacity:1}
.hit{fill:transparent;cursor:pointer}
.hit.done{pointer-events:none}
#bar{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:5}
#bar span,#bar button{pointer-events:auto;background:rgba(30,8,50,.72);color:#fff;border:0;border-radius:20px;padding:7px 14px;font:600 14px/1 system-ui,sans-serif}
#ov{position:fixed;inset:0;background:rgba(20,5,35,.55);display:none;align-items:center;justify-content:center;z-index:10;touch-action:none}
#ov.show{display:flex}
#card{width:min(90vw,400px);background:#ece9d8;border:3px solid #0a3fd6;border-top:0;border-radius:9px 9px 3px 3px;box-shadow:0 12px 40px rgba(0,0,0,.55);font:13px Tahoma,Verdana,sans-serif;color:#000;transform:scale(.2);opacity:0;transition:transform .28s cubic-bezier(.3,1.6,.5,1),opacity .15s}
#ov.show #card{transform:scale(1);opacity:1}
#tb{display:flex;align-items:center;gap:6px;height:30px;margin:0 -3px;padding:0 5px;border-radius:8px 8px 0 0;background:linear-gradient(#3c8cf5,#0a5be0 12%,#0553d8 85%,#0a3fd6)}
#logo{display:grid;grid-template:1fr 1fr/1fr 1fr;gap:1px;width:16px;height:16px;transform:skew(-4deg)}
#logo u{display:block}#logo u:nth-child(1){background:#f35325}#logo u:nth-child(2){background:#81bc06}#logo u:nth-child(3){background:#05a6f0}#logo u:nth-child(4){background:#ffba08}
#ttl{flex:1;color:#fff;font:700 15px 'Trebuchet MS',Tahoma,sans-serif;text-shadow:1px 1px #0a1f78}
#x{width:22px;height:22px;box-sizing:border-box;border:1px solid #fff;border-radius:3px;background:linear-gradient(#e9775a,#c8401f);color:#fff;text-align:center;font:700 13px/20px Arial,sans-serif;cursor:pointer}
#bd{padding:16px 14px 14px}
#row{display:flex;gap:14px;align-items:flex-start}
#warn{width:46px;height:46px;flex:none}
#msg{margin:0;font-size:14px;line-height:1.35}
#src::after{content:':'}
#hl::after{content:'. '}
#lnk{color:#00e;text-decoration:underline;cursor:pointer}
#chk{display:flex;align-items:center;gap:6px;margin:18px 0 16px 60px;cursor:pointer}
#box{width:13px;height:13px;box-sizing:border-box;border:1px solid #1c5180;background:#fff;text-align:center;font:700 11px/11px Arial,sans-serif;color:#21a121}
#chk.on #box::after{content:'\2714'}
#more{display:block;margin:0 auto;width:100px;height:26px;border:1px solid #003c74;border-radius:3px;background:linear-gradient(#fff,#ecebe5 85%,#d6d0c5);font:13px Tahoma,Verdana,sans-serif;cursor:pointer;box-shadow:inset 0 0 0 1px #8ab0f0}
#more:active{background:#d6d0c5}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:rgba(30,8,50,.85);color:#fff;padding:10px 16px;border-radius:18px;font:600 14px system-ui,sans-serif;display:none;z-index:6}
</style></head><body>

const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const layer=$('layer'),defs=$('defs');
let popped=0,pool=[],cur=null,AC=null;
function snd(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
const t=AC.currentTime,n=AC.sampleRate*.08,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=1800+Math.random()*900;f.Q.value=.8;
const g=AC.createGain();g.gain.value=1.4;s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t);
const o=AC.createOscillator(),og=AC.createGain();o.frequency.setValueAtTime(380,t);o.frequency.exponentialRampToValueAtTime(70,t+.06);
og.gain.setValueAtTime(.6,t);og.gain.exponentialRampToValueAtTime(.001,t+.07);o.connect(og);og.connect(AC.destination);o.start(t);o.stop(t+.08);}catch(e){}}
function clk(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.setValueAtTime(2200,t);o.frequency.exponentialRampToValueAtTime(900,t+.025);g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.03);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+.04)}catch(e){}}
function el(n,a){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e}
B.forEach((b,i)=>{
 const cp=el('clipPath',{id:'c'+i});cp.appendChild(el('ellipse',{cx:b[0],cy:b[1],rx:b[2],ry:b[3]}));defs.appendChild(cp);
 const g=el('g',{'clip-path':'url(#c'+i+')',class:'pop',id:'p'+i});g.appendChild(el('image',{href:IMG2,x:0,y:0,width:941,height:1672}));layer.appendChild(g);
 const h=el('ellipse',{cx:b[0],cy:b[1],rx:b[2],ry:b[3],class:'hit',id:'h'+i});
 h.addEventListener('pointerdown',e=>{e.preventDefault();pop(i)});layer.appendChild(h);
});
function next(){if(!pool.length)pool=S.map((_,i)=>i).sort(()=>Math.random()-.5);return S[pool.pop()]}
function pop(i){
 if(cur)return;snd();$('p'+i).classList.add('on');$('h'+i).classList.add('done');
 popped++;$('cnt').textContent=popped+' / 12 popped';
 cur=next();$('src').textContent=cur[0];$('hl').textContent=cur[1];$('sm').textContent=cur[2];
 setTimeout(()=>$('ov').classList.add('show'),90);
}
function closeCard(){$('ov').classList.remove('show');cur=null;if(popped>=12){$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3500)}}
let sx=0,sy=0,t0=0;const ov=$('ov');
ov.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;t0=Date.now()});
ov.addEventListener('pointerup',e=>{
 if(!cur)return;const dx=e.clientX-sx,dy=e.clientY-sy,d=Math.hypot(dx,dy);
 if(d>40){closeCard();return}
 const T=e.target;
 if(T.closest('#chk')){clk();$('chk').classList.add('on');setTimeout(()=>{closeCard();$('chk').classList.remove('on')},180);return}
 if(T.closest('#more')||T.closest('#lnk')){snd();const u=cur[3];closeCard();window.open(u,'_blank','noopener');return}
 if(T.closest('#x')){clk();closeCard()}
});
$('reset').addEventListener('click',()=>{popped=0;$('cnt').textContent='0 / 12 popped';document.querySelectorAll('.pop').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.hit').forEach(x=>x.classList.remove('done'));closeCard()});

fetch('stories.json?'+Date.now()).then(r=>r.ok?r.json():[]).then(d=>{if(Array.isArray(d)&&d.length>=12){S=d;pool=[]}}).catch(()=>{});
</script></body></html>

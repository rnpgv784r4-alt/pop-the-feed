const CL=['Art','Entertainment','Oddities','History','Science'],CC={Art:'#D63384',Entertainment:'#E8603C',Oddities:'#E8A020',History:'#8E7BE0',Science:'#1FA58C'},catT={},catN={};let pendingCat=null;

function chime(big){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t=AC.currentTime,ns=big?[523.25,659.25,783.99,1046.5,1318.5]:[587.33,739.99,880];ns.forEach((f,k)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;const st=t+k*.085;g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(.22,st+.015);g.gain.exponentialRampToValueAtTime(.001,st+.35);o.connect(g);g.connect(AC.destination);o.start(st);o.stop(st+.4)})}catch(e){}}

  const a=Math.random()*Math.PI*2,sp=(big?170:120)*(.4+Math.random()),dx=Math.cos(a)*sp,dy=Math.sin(a)*sp-40,fall=120+Math.random()*120,rot=Math.random()*720-360;
  p.animate([{transform:'translate(0,0) rotate(0deg)',opacity:1},{transform:'translate('+dx+'px,'+dy+'px) rotate('+(rot/2)+'deg)',opacity:1,offset:.45},{transform:'translate('+(dx*1.15)+'px,'+(dy+fall)+'px) rotate('+rot+'deg)',opacity:0}],{duration:1000+Math.random()*350,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>p.remove()}}
 if(!big){const l=$('lvl');l.textContent=c+' complete!';l.getAnimations().forEach(a=>a.cancel());l.animate([{opacity:0,transform:'translate(-50%,-14px)'},{opacity:1,transform:'translate(-50%,0)',offset:.2},{opacity:1,transform:'translate(-50%,0)',offset:.75},{opacity:0,transform:'translate(-50%,-6px)'}],{duration:1500})}
}

 setTimeout(()=>$('ov').classList.add('show'),90);
}

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Haptic test</title>
<style>body{margin:0;padding:20px;font:16px system-ui;background:#35024a;color:#fff}h1{font-size:20px}p{color:#d9c4f0;font-size:14px}
button,.sw{display:block;width:100%;margin:12px 0;padding:18px;border:0;border-radius:14px;background:#7b2fbf;color:#fff;font:700 17px system-ui;position:relative;box-sizing:border-box;text-align:center}
.sw input{position:absolute;inset:0;width:100%;height:100%;opacity:.02;margin:0}
#log{font:13px ui-monospace,monospace;color:#ffe9a8;white-space:pre-wrap;margin-top:16px}</style></head><body>
<h1>Pop The Feed – haptic test</h1>
<p>Tap each button on your iPhone. Note which ones you FEEL (tell me the numbers). Check Settings → Sounds &amp; Haptics → System Haptics is on first.</p>
<button id="b1">1. Vibration API</button>
<button id="b2">2. Hidden switch, label.click()</button>
<button id="b3">3. Hidden switch, input.click()</button>
<div class="sw" id="b4">4. Real switch under your finger<input type="checkbox" switch></div>
<div class="sw" id="b5">5. Real plain checkbox (control)<input type="checkbox"></div>
<label id="hl" style="position:fixed;left:0;bottom:0;width:44px;height:26px;opacity:.02"><input id="hi" type="checkbox" switch></label>
<div id="log"></div>
<script>
const L=m=>{document.getElementById('log').textContent+=m+'\n'};
L('UA: '+navigator.userAgent.match(/OS [\d_]+/));L('vibrate API: '+(typeof navigator.vibrate));
b1.onclick=()=>L('1 -> '+(navigator.vibrate?navigator.vibrate(30):'unsupported'));
b2.onclick=()=>{hl.click();L('2 fired')};
b3.onclick=()=>{hi.click();L('3 fired')};
document.querySelectorAll('.sw input').forEach((i,k)=>i.addEventListener('change',()=>L((k+4)+' toggled')));
</script></body></html>

name: Update stories
on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update_feed.py
      - run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add stories.json
          git diff --cached --quiet || (git commit -m "Update stories" && git push)
